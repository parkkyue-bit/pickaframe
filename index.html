<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>PickaFrame Prototype</title>

  <style>
    :root {
      --bg: #101018;
      --panel: #181827;
      --card: #fffaf0;
      --accent: #ffcf5a;
      --accent2: #7dd3fc;
      --text: #f8fafc;
      --muted: #a1a1aa;
      --green: #86efac;
      --red: #fb7185;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, #292942 0%, #101018 55%, #09090f 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      overflow-x: hidden;
    }

    .app {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: 22px 18px 32px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.06em;
      margin: 8px 0 4px;
    }

    .tagline {
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: rgba(24, 24, 39, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      border-radius: 24px;
      padding: 16px;
      margin: 14px 0;
      backdrop-filter: blur(14px);
    }

    .uploadBox {
      border: 1.5px dashed rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 22px 14px;
      text-align: center;
      background: rgba(255,255,255,0.035);
    }

    input[type="file"] {
      display: none;
    }

    .fileLabel {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #16110a;
      font-weight: 800;
      cursor: pointer;
      border: none;
      box-shadow: 0 8px 24px rgba(255, 207, 90, 0.25);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      margin-top: 12px;
    }

    video {
      width: 100%;
      max-height: 280px;
      border-radius: 18px;
      background: #000;
      display: none;
      margin-top: 14px;
    }

    .controls,
    .actionRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: #0f172a;
      background: #e5e7eb;
    }

    button.primary {
      background: var(--accent);
      color: #16110a;
    }

    button.secondary {
      background: #26263a;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
    }

    button.blue {
      background: var(--accent2);
      color: #082f49;
    }

    button.green {
      background: var(--green);
      color: #052e16;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      min-height: 20px;
    }

    .progressWrap {
      height: 9px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
      display: none;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #fb7185);
      transition: width 0.16s ease;
    }

    .spreadPanel {
      display: none;
      position: relative;
      overflow: hidden;
    }

    .spreadTitle {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }

    .spreadTitle h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.04em;
    }

    .counter {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .smallText {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    .heroZone {
      margin-top: 12px;
      height: min(66vh, 500px);
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
      position: relative;
    }

    .heroCard {
      width: min(92%, 360px);
      height: min(61vh, 460px);
      min-height: 350px;
      border-radius: 28px;
      padding: 10px;
      background: var(--card);
      box-shadow:
        0 0 0 3px rgba(255, 207, 90, 0.78),
        0 30px 70px rgba(0,0,0,0.55);
      transform: translateX(0) rotate(0deg);
      transition: transform 0.18s ease;
      position: relative;
    }

    .heroCard.dragging {
      transition: none;
    }

    .heroCard img {
      width: 100%;
      height: calc(100% - 42px);
      object-fit: contain;
      border-radius: 20px;
      background: #111;
      display: block;
    }

    .heroMeta {
      color: #18181b;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      padding: 0 4px;
    }

    .miniFan {
      position: relative;
      height: 125px;
      margin: 8px -10px 6px;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .miniFan:active {
      cursor: grabbing;
    }

    .miniCard {
      position: absolute;
      left: 50%;
      top: 26px;
      width: 56px;
      height: 80px;
      margin-left: -28px;
      border-radius: 11px;
      background: var(--card);
      padding: 3px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.36);
      transition: transform 0.22s ease, opacity 0.22s ease;
      pointer-events: none;
    }

    .miniCard.selected {
      box-shadow:
        0 0 0 3px rgba(255, 207, 90, 1),
        0 10px 22px rgba(0,0,0,0.36);
    }

    .miniCard.picked {
      box-shadow:
        0 0 0 3px rgba(134, 239, 172, 1),
        0 10px 22px rgba(0,0,0,0.36);
    }

    .miniCard img {
      width: 100%;
      height: 63px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      background: #111;
    }

    .fanGuide {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-top: -2px;
    }

    .swipeGuide {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-top: 4px;
    }

    textarea {
      width: 100%;
      min-height: 76px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 12px;
      margin-top: 12px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      font-size: 14px;
    }

    .picksGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .pickItem {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.16s ease, opacity 0.16s ease;
      touch-action: none;
      user-select: none;
    }

    .pickItem.dragging {
      transition: none;
    }

    .pickItem img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      background: #111;
    }

    .pickItem div {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      font-weight: 700;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
      padding: 18px 0 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      background: rgba(0,0,0,0.82);
      color: white;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      z-index: 100;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      max-width: 88vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hiddenCanvas {
      display: none;
    }

    @media (max-width: 390px) {
      .heroCard {
        width: 94%;
        min-height: 335px;
      }

      .heroZone {
        min-height: 380px;
      }

      .logo {
        font-size: 31px;
      }

      .miniCard {
        width: 50px;
        height: 74px;
        margin-left: -25px;
      }

      .miniCard img {
        height: 58px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="logo">PickaFrame</div>
      <div class="tagline">영상 속 원하는 순간을 카드처럼 골라보세요.</div>
    </header>

    <section class="panel">
      <div class="uploadBox">
        <label class="fileLabel" for="videoInput">🎬 영상 불러오기</label>
        <input id="videoInput" type="file" accept="video/*" />
        <div class="hint">
          영상 1개를 넣으면 자동으로 프레임 카드를 만들어요.<br />
          먼저 12장으로 테스트해보세요.
        </div>
      </div>

      <video id="video" controls playsinline muted preload="metadata"></video>

      <div class="controls">
        <button id="make12" class="primary" disabled>12장 카드 만들기</button>
        <button id="make24" class="secondary" disabled>24장 촘촘하게</button>
      </div>

      <div class="progressWrap" id="progressWrap">
        <div class="progress" id="progress"></div>
      </div>

      <div class="status" id="status">영상을 선택해주세요.</div>
    </section>

    <section class="panel spreadPanel" id="spreadPanel">
      <div class="spreadTitle">
        <h2>Pick a frame</h2>
        <div class="counter" id="cardCounter">0 / 0</div>
      </div>

      <div class="smallText">
        큰 카드는 좌우로 넘기고, 아래로 내리면 선택돼요.
      </div>

      <div class="heroZone" id="heroZone">
        <div class="heroCard" id="heroCard">
          <img id="heroImage" alt="선택한 프레임" draggable="false" />
          <div class="heroMeta">
            <span id="heroIndex">00</span>
            <span id="heroTime">0.00초</span>
          </div>
        </div>
      </div>

      <div class="swipeGuide">
        큰 카드: ← → 넘기기 · ↓ 선택
      </div>

      <div class="miniFan" id="miniFan"></div>

      <div class="fanGuide">
        아래 카드줄을 손가락으로 문지르면 큰 카드가 바뀌어요.
      </div>

      <div class="actionRow">
        <button class="green" id="pickBtn" disabled>이 장면 선택</button>
        <button class="blue" id="shareBtn" disabled>사진 저장/공유</button>
      </div>

      <div class="actionRow">
        <button class="secondary" id="regenBtn">다시 뽑기</button>
        <button class="secondary" id="tightBtn">더 촘촘하게</button>
      </div>

      <textarea id="memo" placeholder="메모 예: 무릎 위치 설명, 최저점, 팔꿈치 각도 확인"></textarea>
    </section>

    <section class="panel">
      <div class="spreadTitle">
        <h2>내가 고른 순간</h2>
        <div class="counter" id="picksCounter">0장</div>
      </div>

      <div class="smallText">
        카드를 탭하면 공유/저장, 위로 올리면 삭제돼요.
      </div>

      <div id="emptyPicks" class="empty">
        아직 고른 카드가 없어요.<br />
        카드를 아래로 내려 마음에 드는 장면을 선택해보세요.
      </div>

      <div class="picksGrid" id="picksGrid"></div>

      <div class="actionRow">
        <button class="secondary" id="clearPicksBtn">카드함 비우기</button>
        <button class="primary" id="downloadAllBtn">모두 공유/저장</button>
      </div>
    </section>

    <canvas id="canvas" class="hiddenCanvas"></canvas>
    <div class="toast" id="toast"></div>
  </main>

  <script>
    const videoInput = document.getElementById("videoInput");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const make12 = document.getElementById("make12");
    const make24 = document.getElementById("make24");
    const statusEl = document.getElementById("status");
    const progressWrap = document.getElementById("progressWrap");
    const progress = document.getElementById("progress");

    const spreadPanel = document.getElementById("spreadPanel");
    const miniFan = document.getElementById("miniFan");
    const cardCounter = document.getElementById("cardCounter");

    const heroZone = document.getElementById("heroZone");
    const heroCard = document.getElementById("heroCard");
    const heroImage = document.getElementById("heroImage");
    const heroIndex = document.getElementById("heroIndex");
    const heroTime = document.getElementById("heroTime");

    const pickBtn = document.getElementById("pickBtn");
    const shareBtn = document.getElementById("shareBtn");
    const regenBtn = document.getElementById("regenBtn");
    const tightBtn = document.getElementById("tightBtn");
    const memo = document.getElementById("memo");

    const picksGrid = document.getElementById("picksGrid");
    const picksCounter = document.getElementById("picksCounter");
    const emptyPicks = document.getElementById("emptyPicks");
    const clearPicksBtn = document.getElementById("clearPicksBtn");
    const downloadAllBtn = document.getElementById("downloadAllBtn");
    const toast = document.getElementById("toast");

    let videoUrl = null;
    let cards = [];
    let picks = [];
    let selectedIndex = -1;
    let currentCount = 12;
    let regenShift = 0;

    let dragStartX = 0;
    let dragStartY = 0;
    let dragCurrentX = 0;
    let dragCurrentY = 0;
    let isDragging = false;

    let isFanDragging = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function formatTime(ms) {
      const total = ms / 1000;
      return total.toFixed(2) + "초";
    }

    function getSampleTimes(durationMs, count, shiftRatio = 0) {
      const start = durationMs * 0.08;
      const end = durationMs * 0.92;
      const span = end - start;
      const baseStep = count > 1 ? span / (count - 1) : span;

      return Array.from({ length: count }, (_, i) => {
        let t = count === 1 ? durationMs / 2 : start + baseStep * i;
        t += baseStep * shiftRatio;
        t = Math.max(start, Math.min(end, t));
        return Math.round(t);
      });
    }

    function waitForEvent(target, eventName, timeoutMs = 6000) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error(eventName + " timeout"));
        }, timeoutMs);

        function cleanup() {
          clearTimeout(timer);
          target.removeEventListener(eventName, onEvent);
          target.removeEventListener("error", onError);
        }

        function onEvent() {
          cleanup();
          resolve();
        }

        function onError() {
          cleanup();
          reject(new Error("media error"));
        }

        target.addEventListener(eventName, onEvent, { once: true });
        target.addEventListener("error", onError, { once: true });
      });
    }

    async function seekTo(seconds) {
      const clamped = Math.max(0, Math.min(video.duration - 0.05, seconds));

      if (Math.abs(video.currentTime - clamped) < 0.025) {
        return;
      }

      const seeked = waitForEvent(video, "seeked");
      video.currentTime = clamped;
      await seeked;
      await new Promise(resolve => requestAnimationFrame(resolve));
    }

    async function captureFrame(timeMs, index) {
      await seekTo(timeMs / 1000);

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (!vw || !vh) {
        throw new Error("영상 크기를 읽을 수 없습니다.");
      }

      const maxW = 1200;
      const scale = Math.min(1, maxW / vw);
      canvas.width = Math.round(vw * scale);
      canvas.height = Math.round(vh * scale);

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const uri = canvas.toDataURL("image/jpeg", 0.9);

      return {
        id: "card-" + Date.now() + "-" + index,
        uri,
        timeMs,
        index
      };
    }

    async function generateCards(count) {
      if (!video.duration || Number.isNaN(video.duration)) {
        setStatus("영상 정보를 아직 읽지 못했어요.");
        return;
      }

      currentCount = count;
      selectedIndex = -1;
      cards = [];
      miniFan.innerHTML = "";

      progressWrap.style.display = "block";
      progress.style.width = "0%";
      setStatus(`${count}장의 장면 카드를 뽑는 중...`);

      const durationMs = video.duration * 1000;
      const times = getSampleTimes(durationMs, count, regenShift);

      try {
        for (let i = 0; i < times.length; i++) {
          const card = await captureFrame(times[i], i);
          cards.push(card);
          progress.style.width = Math.round(((i + 1) / times.length) * 100) + "%";
          setStatus(`${i + 1} / ${times.length} 장 생성 중...`);
        }

        selectedIndex = Math.floor(cards.length / 2);
        updateSelected();
        spreadPanel.style.display = "block";
        setStatus("카드가 완성됐어요. 좌우로 넘기거나 아래 카드줄을 문질러보세요.");
        spreadPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (err) {
        console.error(err);
        setStatus("프레임 추출 중 문제가 생겼어요. 다른 영상으로 다시 시도해보세요.");
      } finally {
        setTimeout(() => {
          progressWrap.style.display = "none";
        }, 700);
      }
    }

    function updateSelected() {
      const card = cards[selectedIndex];
      const hasCard = Boolean(card);

      pickBtn.disabled = !hasCard;
      shareBtn.disabled = !hasCard;

      if (!hasCard) {
        cardCounter.textContent = "0 / 0";
        heroImage.removeAttribute("src");
        heroIndex.textContent = "00";
        heroTime.textContent = "0.00초";
        return;
      }

      heroImage.src = card.uri;
      heroIndex.textContent = String(selectedIndex + 1).padStart(2, "0");
      heroTime.textContent = formatTime(card.timeMs);
      cardCounter.textContent = `${selectedIndex + 1} / ${cards.length}`;
      renderMiniFan();
    }

    function renderMiniFan() {
      miniFan.innerHTML = "";

      const total = cards.length;
      const angleStart = -58;
      const angleEnd = 58;
      const radiusX = Math.min(185, window.innerWidth * 0.42);
      const radiusY = 26;

      cards.forEach((card, i) => {
        const t = total === 1 ? 0.5 : i / (total - 1);
        const angle = angleStart + (angleEnd - angleStart) * t;
        const rad = angle * Math.PI / 180;
        const x = Math.sin(rad) * radiusX;
        const y = Math.cos(rad) * radiusY;
        const dist = Math.abs(i - selectedIndex);
        const picked = picks.some(p => p.id === card.id);

        const el = document.createElement("div");
        el.className =
          "miniCard" +
          (i === selectedIndex ? " selected" : "") +
          (picked ? " picked" : "");

        el.style.zIndex = i === selectedIndex ? 200 : 100 - dist;
        el.style.opacity = Math.max(0.25, 1 - dist * 0.075);
        el.style.transform = `
          translate(${x}px, ${y}px)
          rotate(${angle * 0.62}deg)
          scale(${i === selectedIndex ? 1.18 : 0.9})
        `;
        el.innerHTML = `<img src="${card.uri}" alt="${i + 1}번 미리보기" draggable="false" />`;
        miniFan.appendChild(el);
      });
    }

    function moveSelection(direction) {
      if (!cards.length) return;

      selectedIndex += direction;

      if (selectedIndex < 0) selectedIndex = 0;
      if (selectedIndex > cards.length - 1) selectedIndex = cards.length - 1;

      updateSelected();
    }

    function selectCardByFanPosition(clientX) {
      if (!cards.length) return;

      const rect = miniFan.getBoundingClientRect();
      const x = clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, x / rect.width));
      const nextIndex = Math.round(ratio * (cards.length - 1));

      if (nextIndex !== selectedIndex) {
        selectedIndex = nextIndex;
        updateSelected();
      }
    }

    function pickSelectedCard() {
      const card = cards[selectedIndex];
      if (!card) return;

      const already = picks.some(p => p.id === card.id);

      if (!already) {
        picks.push({
          ...card,
          memo: memo.value.trim()
        });
        showToast(`${selectedIndex + 1}번 카드를 담았어요.`);
      } else {
        showToast("이미 카드함에 담긴 장면이에요.");
      }

      renderPicks();
      renderMiniFan();
    }

    function dataUrlToFile(dataUrl, filename) {
      const arr = dataUrl.split(",");
      const mimeMatch = arr[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
      const binary = atob(arr[1]);
      let n = binary.length;
      const u8arr = new Uint8Array(n);

      while (n--) {
        u8arr[n] = binary.charCodeAt(n);
      }

      return new File([u8arr], filename, { type: mime });
    }

    async function shareOrDownloadCard(card, filename) {
      if (!card) return;

      const file = dataUrlToFile(card.uri, filename);

      try {
        if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
          await navigator.share({
            files: [file],
            title: "PickaFrame",
            text: "PickaFrame에서 고른 장면"
          });
          return;
        }
      } catch (err) {
        console.warn("share cancelled or failed", err);
      }

      try {
        const a = document.createElement("a");
        a.href = card.uri;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast("다운로드를 시도했어요. 안 보이면 이미지를 길게 눌러 저장해보세요.");
      } catch (err) {
        const w = window.open();
        if (w) {
          w.document.write(`<img src="${card.uri}" style="max-width:100%;height:auto;" />`);
        }
      }
    }

    async function shareAllPicks() {
      if (!picks.length) {
        showToast("저장할 카드가 없어요.");
        return;
      }

      const files = picks.map((pick, i) => {
        return dataUrlToFile(
          pick.uri,
          `pickaframe-picked-${i + 1}-${Math.round(pick.timeMs)}ms.jpg`
        );
      });

      try {
        if (navigator.canShare && navigator.canShare({ files }) && navigator.share) {
          await navigator.share({
            files,
            title: "PickaFrame",
            text: `${picks.length}장의 PickaFrame 장면 카드`
          });
          showToast(`${picks.length}장을 공유했어요.`);
          return;
        }
      } catch (err) {
        console.warn("multi share failed", err);
      }

      showToast("여러 장 공유가 막혀서 한 장씩 저장창을 열게요.");

      for (let i = 0; i < picks.length; i++) {
        await sleep(900);
        await shareOrDownloadCard(
          picks[i],
          `pickaframe-picked-${i + 1}-${Math.round(picks[i].timeMs)}ms.jpg`
        );
      }
    }

    function renderPicks() {
      picksGrid.innerHTML = "";
      picksCounter.textContent = `${picks.length}장`;
      emptyPicks.style.display = picks.length ? "none" : "block";

      picks.forEach((pick, i) => {
        const el = document.createElement("div");
        el.className = "pickItem";
        el.innerHTML = `
          <img src="${pick.uri}" alt="고른 카드 ${i + 1}" draggable="false" />
          <div>${i + 1}. ${formatTime(pick.timeMs)}</div>
        `;

        let pickStartY = 0;
        let pickStartX = 0;
        let pickMoveY = 0;
        let pickMoveX = 0;
        let pickDragging = false;

        el.addEventListener("pointerdown", (e) => {
          pickStartY = e.clientY;
          pickStartX = e.clientX;
          pickMoveY = 0;
          pickMoveX = 0;
          pickDragging = true;
          el.classList.add("dragging");
          el.setPointerCapture(e.pointerId);
        });

        el.addEventListener("pointermove", (e) => {
          if (!pickDragging) return;

          pickMoveY = e.clientY - pickStartY;
          pickMoveX = e.clientX - pickStartX;

          if (pickMoveY < 0) {
            el.style.transform = `translateY(${pickMoveY}px) rotate(${pickMoveX * 0.05}deg)`;
            el.style.opacity = String(Math.max(0.25, 1 + pickMoveY / 130));
          }
        });

        el.addEventListener("pointerup", (e) => {
          if (!pickDragging) return;

          pickDragging = false;
          el.classList.remove("dragging");

          const diffY = e.clientY - pickStartY;
          const diffX = e.clientX - pickStartX;

          el.style.transform = "";
          el.style.opacity = "";

          if (diffY < -55 && Math.abs(diffY) > Math.abs(diffX)) {
            picks.splice(i, 1);
            renderPicks();
            renderMiniFan();
            showToast("카드를 삭제했어요.");
            return;
          }

          shareOrDownloadCard(
            pick,
            `pickaframe-${i + 1}-${Math.round(pick.timeMs)}ms.jpg`
          );
        });

        el.addEventListener("pointercancel", () => {
          pickDragging = false;
          el.classList.remove("dragging");
          el.style.transform = "";
          el.style.opacity = "";
        });

        picksGrid.appendChild(el);
      });
    }

    videoInput.addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      if (videoUrl) URL.revokeObjectURL(videoUrl);
      videoUrl = URL.createObjectURL(file);

      cards = [];
      picks = [];
      selectedIndex = -1;
      renderPicks();
      miniFan.innerHTML = "";
      spreadPanel.style.display = "none";
      make12.disabled = true;
      make24.disabled = true;

      video.src = videoUrl;
      video.style.display = "block";
      setStatus("영상 정보를 읽는 중...");

      try {
        await waitForEvent(video, "loadedmetadata", 8000);
        make12.disabled = false;
        make24.disabled = false;
        setStatus(`영상 준비 완료 · 길이 ${video.duration.toFixed(1)}초`);
      } catch (err) {
        console.error(err);
        setStatus("영상 정보를 읽지 못했어요. 다른 파일로 시도해보세요.");
      }
    });

    heroZone.addEventListener("pointerdown", (e) => {
      if (!cards.length) return;

      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragCurrentX = 0;
      dragCurrentY = 0;

      heroCard.classList.add("dragging");
      heroZone.setPointerCapture(e.pointerId);
    });

    heroZone.addEventListener("pointermove", (e) => {
      if (!isDragging) return;

      dragCurrentX = e.clientX - dragStartX;
      dragCurrentY = e.clientY - dragStartY;

      const rotate = dragCurrentX * 0.035;

      heroCard.style.transform = `
        translate(${dragCurrentX}px, ${dragCurrentY}px)
        rotate(${rotate}deg)
      `;
    });

    heroZone.addEventListener("pointerup", (e) => {
      if (!isDragging) return;

      isDragging = false;
      heroCard.classList.remove("dragging");
      heroZone.releasePointerCapture(e.pointerId);

      const dx = dragCurrentX;
      const dy = dragCurrentY;

      heroCard.style.transform = "translateX(0) rotate(0deg)";

      if (dy > 95 && Math.abs(dy) > Math.abs(dx) * 0.8) {
        pickSelectedCard();
        return;
      }

      if (dx < -70) {
        moveSelection(1);
        return;
      }

      if (dx > 70) {
        moveSelection(-1);
        return;
      }
    });

    heroZone.addEventListener("pointercancel", () => {
      isDragging = false;
      heroCard.classList.remove("dragging");
      heroCard.style.transform = "translateX(0) rotate(0deg)";
    });

    miniFan.addEventListener("pointerdown", (e) => {
      if (!cards.length) return;

      isFanDragging = true;
      miniFan.setPointerCapture(e.pointerId);
      selectCardByFanPosition(e.clientX);
    });

    miniFan.addEventListener("pointermove", (e) => {
      if (!isFanDragging) return;
      selectCardByFanPosition(e.clientX);
    });

    miniFan.addEventListener("pointerup", (e) => {
      if (!isFanDragging) return;

      isFanDragging = false;
      miniFan.releasePointerCapture(e.pointerId);
      selectCardByFanPosition(e.clientX);
    });

    miniFan.addEventListener("pointercancel", () => {
      isFanDragging = false;
    });

    make12.addEventListener("click", () => {
      regenShift = 0;
      generateCards(12);
    });

    make24.addEventListener("click", () => {
      regenShift = 0;
      generateCards(24);
    });

    pickBtn.addEventListener("click", pickSelectedCard);

    shareBtn.addEventListener("click", () => {
      const card = cards[selectedIndex];
      if (!card) return;
      shareOrDownloadCard(
        card,
        `pickaframe-${selectedIndex + 1}-${Math.round(card.timeMs)}ms.jpg`
      );
    });

    regenBtn.addEventListener("click", () => {
      regenShift += 0.22;
      if (regenShift > 0.75) regenShift = -0.35;
      generateCards(currentCount);
    });

    tightBtn.addEventListener("click", () => {
      generateCards(24);
    });

    clearPicksBtn.addEventListener("click", () => {
      picks = [];
      renderPicks();
      renderMiniFan();
      showToast("카드함을 비웠어요.");
    });

    downloadAllBtn.addEventListener("click", shareAllPicks);

    window.addEventListener("resize", () => {
      if (cards.length) renderMiniFan();
    });

    renderPicks();
  </script>
</body>
</html>
